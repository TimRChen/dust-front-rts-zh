name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  translations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate translations (offline)
        run: python tools/verify.py --strict-warnings

      - name: Check the scripts compile
        run: python -m compileall -q tools

      - name: Guard against committed game files
        run: |
          if git ls-files | grep -E '\.(assets|resS|resource|dll|exe)$|Dust Front RTS_Data'; then
            echo "::error::game files must not be committed"
            exit 1
          fi
